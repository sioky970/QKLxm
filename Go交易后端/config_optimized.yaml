# Exchange Go 配置文件

app:
  name: "exchange-go"
  mode: "release"  # debug, release, test - release模式隐藏正常日志
  port: 8080
  jwt_secret: "your-jwt-secret-key-change-in-production"
  jwt_expire: 86400  # 24小时

# MySQL 数据库配置（主库 - 写操作）
database:
  host: "127.0.0.1"
  port: 3306
  user: "root"
  password: "root123456"
  dbname: "bibi2022"
  charset: "utf8"  # 使用 utf8 避免 MySQL 5.6 索引长度限制
  max_idle_conns: 20
  max_open_conns: 500
  conn_max_lifetime: 3600  # 连接最大生命周期（秒）

# 读写分离配置（可选）
read_write_separation:
  enabled: false  # 是否启用读写分离
  master_weight: 1  # 主库读权重（启用时如果从库故障会回退到主库）
  slave_read_only: true  # 从库是否设置为只读
  slaves:
    # 从库配置列表（启用读写分离时需要配置）
    # - host: "192.168.1.101"
    #   port: 3306
    #   weight: 10  # 读权重，用于负载均衡
    # - host: "192.168.1.102"
    #   port: 3306
    #   weight: 10

# Redis 配置
redis:
  host: "127.0.0.1"
  port: 6379
  password: ""
  db: 0
  pool_size: 100
  min_idle_conns: 10

# Redis 缓存配置
redis_cache:
  enabled: true  # 是否启用Redis缓存
  # 用户资产缓存
  user_assets:
    enabled: true
    expiration: 30  # 秒
  # 用户余额缓存
  user_balance:
    enabled: true
    expiration: 10  # 秒
  # 交易对配置缓存
  currency_match:
    enabled: true
    expiration: 300  # 秒
  # 币种配置缓存
  currency:
    enabled: true
    expiration: 600  # 秒
  # KYC状态缓存
  kyc_status:
    enabled: true
    expiration: 300  # 秒
  # 行情价格缓存
  market_price:
    enabled: true
    expiration: 5  # 秒
  # 统计数据缓存
  statistics:
    enabled: true
    expiration: 60  # 秒
  # 排行榜缓存
  leaderboard:
    enabled: true
    expiration: 300  # 秒
  # 限流配置
  rate_limit:
    enabled: true
    window: 60  # 限流时间窗口（秒）

# 日志配置
log:
  level: "error"  # debug, info, warn, error - 只显示错误日志
  filename: "logs/app.log"
  max_size: 100    # MB
  max_backups: 30
  max_age: 7       # 天
  compress: true

# WebSocket 配置
websocket:
  port: 8081
  read_buffer_size: 1024
  write_buffer_size: 1024
  heartbeat_interval: 30  # 秒

# 第三方 API
huobi:
  api_url: "https://api.huobi.pro"
  ws_url: "wss://api.huobi.pro/ws"

# 数据库连接池监控
monitor:
  enabled: true
  check_interval: 30  # 检查间隔（秒）
  slow_query_threshold: 1000  # 慢查询阈值（毫秒）

# 性能优化配置
performance:
  # GORM配置
  gorm:
    log_mode: false  # 是否记录GORM SQL日志
    prepare_stmt: true  # 预编译语句
  # 连接池优化
  connection_pool:
    health_check_interval: 30  # 健康检查间隔（秒）
    max_idle_time: 300  # 最大空闲时间（秒）
