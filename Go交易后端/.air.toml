# Air热重载配置文件 - 适配交易所后端项目
# 官方文档: https://github.com/air-verse/air

# 工作目录
root = "."

# 临时目录（存放编译后的二进制文件）
tmp_dir = "tmp"

[build]
  # 需要监听的命令（主程序入口）
  cmd = "go build -o ./tmp/exchange-api.exe ./cmd/api"
  
  # 编译后的二进制文件路径
  bin = "tmp/exchange-api.exe"
  
  # 运行二进制文件时的参数
  args_bin = ["-c", "config/config.yaml"]
  
  # 自定义的二进制文件运行方式
  full_bin = ""
  
  # 监听以下扩展名的文件变化
  include_ext = ["go", "yaml"]
  
  # 监听以下文件名的文件变化（配置文件）
  include_file = []
  
  # 排除以下扩展名的文件
  exclude_dir = ["tmp", "vendor", "logs", "uploads", "test_scripts", "docs", "scripts", ".git", ".idea", ".vscode"]
  
  # 排除以下文件
  exclude_file = []
  
  # 排除匹配以下正则表达式的文件
  exclude_regex = ["_test\\.go$", ".*\\.log$", ".*\\.md$"]
  
  # 排除未更改的文件
  exclude_unchanged = true
  
  # 在执行命令前follow symlink
  follow_symlink = true
  
  # 延迟构建（毫秒），避免频繁重启
  delay = 1000
  
  # 发生构建错误时停止运行旧的二进制文件
  stop_on_error = true
  
  # 在构建前删除旧的二进制文件
  kill_delay = "0s"
  
  # 构建日志输出
  log = "tmp/build-errors.log"
  
  # 只在特定目录改变时重新构建
  include_dir = []
  
  # 重新编译时同时运行 (kill旧进程, 编译, 重启)
  rerun = false
  
  # 使用轮询而不是fsnotify（Windows推荐）
  poll = false
  
  # 轮询间隔（毫秒）
  poll_interval = 500
  
  # 发送中断信号前延迟
  send_interrupt = false

[color]
  # 自定义每个部分的显示颜色
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"
  app = "white"

[log]
  # 在控制台显示时间
  time = true
  
  # 只显示主日志（隐藏构建和运行器日志）
  main_only = false

[misc]
  # 在启动时清空控制台
  clean_on_exit = true

[screen]
  # 清空屏幕后显示 (false: 清空整个屏幕, true: 清空到行)
  clear_on_rebuild = true
  
  # 启用控制台颜色输出
  keep_scroll = true
