# ============================================================
# MySQL 5.7 优化配置文件
# 交易所系统专用
# ============================================================
# 使用方法：
# 1. 备份当前 MySQL 配置文件
# 2. 将此文件内容复制到 my.ini
# 3. 重启 MySQL 服务
# ============================================================

[mysqld]
# ------------------------------------------------------------
# 基本配置
# ------------------------------------------------------------
server-id = 1
port = 3306

# 字符集配置
character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci
init_connect = 'SET NAMES utf8mb4'

# 忽略表名大小写（Windows/Linux混合部署时建议开启）
lower_case_table_names = 1

# ------------------------------------------------------------
# InnoDB 缓冲池配置（核心优化）
# ------------------------------------------------------------
# 缓冲池大小 - 建议设置为物理内存的70-80%
# 如果物理内存为16GB，建议设置为12G
innodb_buffer_pool_size = 12G

# 日志文件配置
innodb_log_file_size = 1G
innodb_log_buffer_size = 64M
innodb_log_files_in_group = 2

# 刷新策略（性能与安全平衡）
# 2 表示每秒刷新一次日志，兼顾性能和安全性
innodb_flush_log_at_trx_commit = 2
innodb_doublewrite = 1

# 并发与锁配置
innodb_thread_concurrency = 0
innodb_lock_wait_timeout = 50
innodb_print_all_deadlocks = 1

# 表空间配置
innodb_file_per_table = 1
innodb_file_format = Barracuda
innodb_large_prefix = 1

# I/O配置
innodb_io_capacity = 2000
innodb_io_capacity_max = 4000
innodb_read_io_threads = 8
innodb_write_io_threads = 8
innodb_purge_threads = 4

# ------------------------------------------------------------
# 连接配置
# ------------------------------------------------------------
max_connections = 500
max_connect_errors = 100000
wait_timeout = 600
interactive_timeout = 600

# 线程缓存
thread_cache_size = 64

# 表缓存
table_open_cache = 4000
table_definition_cache = 2000

# 网络配置
max_allowed_packet = 256M
skip-name-resolve = 1

# ------------------------------------------------------------
# 临时表与内存表配置
# ------------------------------------------------------------
tmp_table_size = 256M
max_heap_table_size = 256M

# ------------------------------------------------------------
# 查询缓存（MySQL 5.7已弃用，建议关闭）
# ------------------------------------------------------------
query_cache_type = 0
query_cache_size = 0

# ------------------------------------------------------------
# 排序与分组配置
# ------------------------------------------------------------
sort_buffer_size = 4M
join_buffer_size = 4M
read_buffer_size = 2M
read_rnd_buffer_size = 8M

# ------------------------------------------------------------
# 慢查询日志配置
# ------------------------------------------------------------
slow_query_log = 1
slow_query_log_file = "C:/ProgramData/MySQL/MySQL Server 5.7/Data/slow.log"
long_query_time = 1
log_queries_not_using_indexes = 1

# ------------------------------------------------------------
# 错误日志配置
# ------------------------------------------------------------
log_error = "C:/ProgramData/MySQL/MySQL Server 5.7/Data/error.log"

# ------------------------------------------------------------
# 二进制日志配置（主从复制用，可选）
# ------------------------------------------------------------
# 如果不需要主从复制，请注释以下行
# log-bin = mysql-bin
# binlog_format = ROW
# max_binlog_size = 1G
# expire_logs_days = 7

# ------------------------------------------------------------
# 性能Schema配置（MySQL 5.7性能监控）
# ------------------------------------------------------------
performance_schema = ON

# ------------------------------------------------------------
# 安全管理配置
# ------------------------------------------------------------
local_infile = 0
symbolic-links = 0

# SQL模式
sql_mode = 'NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES'

[client]
port = 3306
default-character-set = utf8mb4

[mysql]
default-character-set = utf8mb4

# ============================================================
# 内存使用估算（参考）
# ============================================================
# innodb_buffer_pool_size: 12G
# sort_buffer_size * max_connections: 4M * 500 = 2G
# join_buffer_size * max_connections: 4M * 500 = 2G
# read_buffer_size * max_connections: 2M * 500 = 1G
# read_rnd_buffer_size * max_connections: 8M * 500 = 4G
# tmp_table_size: 256M
# max_heap_table_size: 256M
# 预估总内存: 约 16-18G
# ============================================================
