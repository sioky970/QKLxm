# ============================================================
# MySQL 主从复制配置 - 读写分离架构
# 交易所系统专用
# ============================================================
# 此配置文件用于主库和从库的my.ini
# 使用方法：
# 1. 主库配置：复制 [mysqld] 和 [master] 部分
# 2. 从库配置：复制 [mysqld] 和 [slave] 部分
# 3. 执行主从复制配置脚本
# ============================================================

# ------------------------------------------------------------
# 主库配置 [mysqld section]
# ------------------------------------------------------------
[mysqld]
server-id = 1
port = 3306

# 字符集配置
character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci
init_connect = 'SET NAMES utf8mb4'
lower_case_table_names = 1

# InnoDB 缓冲池配置
innodb_buffer_pool_size = 12G
innodb_log_file_size = 1G
innodb_log_buffer_size = 64M
innodb_log_files_in_group = 2
innodb_flush_log_at_trx_commit = 1  # 主库建议设置为1，保证数据安全
innodb_doublewrite = 1

# 并发配置
innodb_thread_concurrency = 0
innodb_lock_wait_timeout = 50
innodb_io_capacity = 2000
innodb_io_capacity_max = 4000
innodb_read_io_threads = 8
innodb_write_io_threads = 8

# 连接配置
max_connections = 500
max_connect_errors = 100000
wait_timeout = 600
interactive_timeout = 600
thread_cache_size = 64
table_open_cache = 4000
table_definition_cache = 2000

# 网络配置
max_allowed_packet = 256M
skip-name-resolve = 1

# 临时表配置
tmp_table_size = 256M
max_heap_table_size = 256M

# 查询缓存（已弃用，关闭）
query_cache_type = 0
query_cache_size = 0

# 排序缓冲
sort_buffer_size = 4M
join_buffer_size = 4M
read_buffer_size = 2M
read_rnd_buffer_size = 8M

# 慢查询日志
slow_query_log = 1
slow_query_log_file = "C:/ProgramData/MySQL/MySQL Server 5.7/Data/slow.log"
long_query_time = 1
log_queries_not_using_indexes = 1

# 错误日志
log_error = "C:/ProgramData/MySQL/MySQL Server 5.7/Data/error.log"

# ------------------------------------------------------------
# 主库专用配置 [master section]
# ------------------------------------------------------------
# 二进制日志配置（必须启用）
log-bin = mysql-bin
binlog_format = ROW
binlog_row_image = FULL
max_binlog_size = 1G
binlog_cache_size = 64M
expire_logs_days = 7
sync_binlog = 1  # 每次事务同步二进制日志

# GTID配置（MySQL 5.7+）
gtid_mode = ON
enforce_gtid_consistency = 1

# 复制限流
# slave_net_timeout = 60  # 从库连接超时

# 性能监控
performance_schema = ON

# 安全配置
local_infile = 0
symbolic-links = 0
sql_mode = 'NO_ENGINE_SUBSTITUTION,STRICT_TRANS_TABLES'

[client]
port = 3306
default-character-set = utf8mb4

[mysql]
default-character-set = utf8mb4

# ------------------------------------------------------------
# 主库授权语句（需要手动执行）
# ------------------------------------------------------------
# 在主库上执行以下SQL创建复制用户：
#
# CREATE USER 'repl_user'@'%' IDENTIFIED BY 'repl_password123';
# GRANT REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'repl_user'@'%';
# FLUSH PRIVILEGES;
#
# ------------------------------------------------------------
# 从库配置 [slave section - 仅从库使用]
# ------------------------------------------------------------
# server-id 必须是唯一的（从库使用不同的ID）
# server-id = 2
#
# 复制相关配置
# relay-log = "C:/ProgramData/MySQL/MySQL Server 5.7/Data/relay-log"
# relay-log-purge = ON
# relay-log-recovery = ON
# slave-parallel-workers = 4  # 并行复制（MySQL 5.7.6+）
# slave-parallel-type = LOGICAL_CLOCK  # 基于组提交的并行复制
#
# 跳过错误（可选）
# slave-skip-errors = ddl_exist_errors
#
# ------------------------------------------------------------
# 从库连接主库语句（需要手动执行）
# ------------------------------------------------------------
# 在从库上执行以下SQL连接主库：
#
# CHANGE MASTER TO
#     MASTER_HOST='主库IP',
#     MASTER_USER='repl_user',
#     MASTER_PASSWORD='repl_password123',
#     MASTER_PORT=3306,
#     MASTER_AUTO_POSITION=1,
#     GET_MASTER_PUBLIC_KEY=1;
#
# START SLAVE;
# SHOW SLAVE STATUS\G
#
# ------------------------------------------------------------
